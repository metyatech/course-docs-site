name: Deploy course site

on:
  workflow_call:
    inputs:
      shared_runtime_ref:
        description: Shared runtime commit SHA or branch to use for this deployment.
        required: false
        type: string
        default: production-runtime
      next_public_works_base_url:
        description: Optional Student Works base URL used by the Programming course site.
        required: false
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: course-site-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 50.9.6
      COURSE_CONTENT_SOURCE: ../course-content
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing one or more required Vercel secrets."
            exit 1
          fi

      - name: Validate shared runtime ref
        env:
          SHARED_RUNTIME_REF: ${{ inputs.shared_runtime_ref }}
        run: |
          if [[ "$SHARED_RUNTIME_REF" =~ ^([0-9A-Fa-f]{40}|[0-9A-Fa-f]{64})$ ]]; then
            exit 0
          fi

          if ! git check-ref-format --branch "$SHARED_RUNTIME_REF" >/dev/null; then
            echo "Shared runtime ref must be a valid Git branch name or full commit SHA."
            exit 1
          fi

      - name: Checkout course content
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: course-content
          persist-credentials: false

      - name: Checkout shared runtime
        uses: actions/checkout@v6
        id: shared-runtime
        with:
          repository: metyatech/course-docs-site
          ref: ${{ inputs.shared_runtime_ref }}
          path: site
          persist-credentials: false

      - name: Record deployment provenance
        env:
          CONTENT_REPOSITORY: ${{ github.repository }}
          CONTENT_SHA: ${{ github.sha }}
          SHARED_RUNTIME_REF: ${{ inputs.shared_runtime_ref }}
        run: |
          SHARED_RUNTIME_SHA=$(git -C site rev-parse HEAD)
          {
            echo "## Deployment provenance"
            echo "- Content repository: ${CONTENT_REPOSITORY}"
            echo "- Content SHA: ${CONTENT_SHA}"
            echo "- Shared runtime requested ref: ${SHARED_RUNTIME_REF}"
            echo "- Shared runtime SHA: ${SHARED_RUNTIME_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment content SHA: ${CONTENT_SHA}"
          echo "Deployment shared runtime SHA: ${SHARED_RUNTIME_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install npm 11.19.1
        run: npm install --global npm@11.19.1
        working-directory: ${{ runner.temp }}

      - name: Configure optional build environment
        if: inputs.next_public_works_base_url != ''
        env:
          NEXT_PUBLIC_WORKS_BASE_URL_INPUT: ${{ inputs.next_public_works_base_url }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs';

          const value = process.env.NEXT_PUBLIC_WORKS_BASE_URL_INPUT;
          if (value.includes('\n') || value.includes('\r')) {
            throw new Error('NEXT_PUBLIC_WORKS_BASE_URL must be a single-line URL.');
          }

          const url = new URL(value);
          if (url.protocol !== 'https:') {
            throw new Error('NEXT_PUBLIC_WORKS_BASE_URL must use HTTPS.');
          }

          appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_WORKS_BASE_URL=${value}\n`);
          EOF

      - name: Vercel auth and project preflight
        run: |
          npx vercel@${{ env.VERCEL_CLI_VERSION }} whoami --token="$VERCEL_TOKEN"
          node --input-type=module <<'EOF'
          const projectId = process.env.VERCEL_PROJECT_ID;
          const teamId = process.env.VERCEL_ORG_ID;
          const token = process.env.VERCEL_TOKEN;

          async function check(url, label) {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${token}` },
            });

            if (!response.ok) {
              throw new Error(`${label} failed with HTTP ${response.status}.`);
            }

            return response.json();
          }

          const user = await check('https://api.vercel.com/www/user', 'Vercel user lookup');
          const project = await check(
            `https://api.vercel.com/v9/projects/${projectId}?teamId=${teamId}`,
            'Vercel project lookup',
          );

          if (project.id !== projectId) {
            throw new Error('Vercel resolved a project different from VERCEL_PROJECT_ID.');
          }

          console.log(`Authenticated as ${user.user.username}; verified Vercel project ${project.name}.`);
          EOF

      - name: Install shared runtime
        working-directory: site
        run: npm ci

      - name: Pull Vercel production settings
        working-directory: site
        run: npx vercel@${{ env.VERCEL_CLI_VERSION }} pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel production
        working-directory: site
        run: npx vercel@${{ env.VERCEL_CLI_VERSION }} build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production (retry once)
        working-directory: site
        run: |
          npx vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN" || \
          npx vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
